[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmip6-data-toolkit"
version = "2.5.0"
description = "Interactive CMIP6 climate model data discovery, federated search, automated NetCDF batch downloader & subsetting engine."
readme = "README.md"
authors = [
  { name = "Avishek Acharya", email = "avishek@example.com" }
]
license = { text = "MIT" }
dependencies = [
  "streamlit>=1.20.0",
  "requests>=2.28.0",
  "xarray>=2022.03.0",
  "netCDF4>=1.5.8",
  "numpy>=1.21.0",
  "pandas>=1.4.0",
]

[project.urls]
"Homepage" = "https://github.com/avishek-acharya/cmip6-data-toolkit"
"Bug Tracker" = "https://github.com/avishek-acharya/cmip6-data-toolkit/issues"
